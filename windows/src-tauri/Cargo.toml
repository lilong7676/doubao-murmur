[package]
name = "doubao-murmur"
version = "1.5.0"
edition = "2021"
rust-version = "1.77"
description = "Voice-to-text input using Doubao ASR"
authors = ["lilong7676"]
license = "MIT"

[lib]
name = "doubao_murmur"
path = "src/lib.rs"

[[bin]]
name = "doubao-murmur"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time", "net", "macros"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
cpal = "0.15"
# Text-only: arboard already implements the open-retry dance that makes clipboard
# writes reliable when another process is holding it.
arboard = { version = "3", default-features = false }
uuid = { version = "1", features = ["v4"] }
ureq = { version = "2", default-features = false, features = ["native-tls"] }

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    # CreateMutexW and RegCreateKeyExW take SECURITY_ATTRIBUTES, so they live
    # behind this feature even though no security descriptor is used.
    "Win32_Security",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
# Size matters here: this replaced a 42 MB WinUI installer.
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
